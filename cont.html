<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-navy fixed-top">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">Fitness<span class="text-green">Tracker</span></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#meniu" aria-controls="meniu" aria-expanded="false" aria-label="Deschide meniul">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="meniu">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center">
            <li class="nav-item"><a class="nav-link" href="index.html">Acasă</a></li>
            <li class="nav-item"><a class="nav-link" href="exercitii.html">Exerciții</a></li>
            <li class="nav-item"><a class="nav-link" href="antrenamente.html">Antrenamente</a></li>
            <li class="nav-item"><a class="nav-link" href="obiective.html">Obiective</a></li>
            <li class="nav-item"><a class="nav-link" href="progres.html">Progres</a></li>
            <li class="nav-item ms-lg-3"><a class="btn btn-green btn-sm" href="cont.html">Autentificare</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container py-5">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
      <div><h1 class="h2 mb-1">Contul meu</h1><p class="text-muted mb-0">Autentifică-te sau creează un cont nou.</p></div>
      
    </div>
    <div class="row g-4">
      <section class="col-md-6" aria-labelledby="t-login"><div class="card-box p-4">
        <h2 id="t-login" class="h4 mb-3">Autentificare</h2>
        <form>
          <div class="mb-3"><label class="form-label" for="login-email">Email</label><input type="email" class="form-control" id="login-email" placeholder="nume@exemplu.ro"></div>
          <div class="mb-3"><label class="form-label" for="login-parola">Parolă</label><input type="password" class="form-control" id="login-parola"></div>
          <button type="submit" class="btn btn-green w-100">Intră în cont</button>
        </form>
      </div></section>
      <section class="col-md-6" aria-labelledby="t-reg"><div class="card-box p-4">
        <h2 id="t-reg" class="h4 mb-3">Cont nou</h2>
        <form>
          <div class="mb-3"><label class="form-label" for="reg-nume">Nume complet</label><input type="text" class="form-control" id="reg-nume"></div>
          <div class="mb-3"><label class="form-label" for="reg-email">Email</label><input type="email" class="form-control" id="reg-email"></div>
          <div class="row g-3 mb-3">
            <div class="col-4"><label class="form-label" for="reg-varsta">Vârstă</label><input type="number" class="form-control" id="reg-varsta"></div>
            <div class="col-4"><label class="form-label" for="reg-greutate">Greutate (kg)</label><input type="number" class="form-control" id="reg-greutate"></div>
            <div class="col-4"><label class="form-label" for="reg-inaltime">Înălțime (cm)</label><input type="number" class="form-control" id="reg-inaltime"></div>
          </div>
          <div class="mb-3"><label class="form-label" for="reg-parola">Parolă</label><input type="password" class="form-control" id="reg-parola"></div>
          <button type="submit" class="btn btn-orange w-100">Creează cont</button>
        </form>
      </div></section>
    </div>
  </main>

  <footer class="bg-navy text-light-soft py-4">
    <div class="container">
      <div class="row gy-3 align-items-center">
        <div class="col-md-6"><p class="mb-0">&copy; 2026 FitnessTracker · Proiect Programare Multimedia</p></div>

            <li class="list-inline-item"><a href="obiective.html">Obiective</a></li>
            <li class="list-inline-item"><a href="progres.html">Progres</a></li>
            <li class="list-inline-item"><a href="cont.html">Cont</a></li>
          </ul>
        </div>
      </div>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
